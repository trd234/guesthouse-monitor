name: 共用施設 空き自動予約

on:
  workflow_dispatch:         # 外部cron（cron-job.org）または手動で実行
    inputs:
      dry_run:
        description: '0=本番で予約 / 1=予約しない（確認まで）'
        default: '0'

# 同時に複数走らないようにする（二重予約防止）
concurrency:
  group: miwa-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      # 予約済み・通知済みの記録を前回から引き継ぐ（重複通知・二重予約防止）
      - uses: actions/cache@v5
        with:
          path: miwa_state.json
          key: miwa-state-${{ github.run_id }}
          restore-keys: miwa-state-

      - name: 空き監視＆自動予約
        run: python miwa_monitor.py
        env:
          MIWA_BASE_URL: ${{ secrets.MIWA_BASE_URL }}
          MIWA_FACILITY_ID_RESERVE: ${{ secrets.MIWA_FACILITY_ID_RESERVE }}
          MIWA_USER_ID: ${{ secrets.MIWA_USER_ID }}
          MIWA_PASSWORD: ${{ secrets.MIWA_PASSWORD }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          MIWA_DRY_RUN: ${{ inputs.dry_run || '0' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miwa-monitor-screenshots
          path: artifacts/
          if-no-files-found: ignore

name: 共用施設 抽選自動申込

on:
  schedule:
    - cron: '0 1 * * *'     # 毎日 10:00 JST（本番）
  workflow_dispatch:         # 手動実行
    inputs:
      dry_run:
        description: '1=確認ページで止める（安全） / 0=本番で申込む'
        default: '1'
      target_date:
        description: '対象日 YYYY-MM-DD（空欄=60日後。指定時は曜日不問）'
        default: ''

jobs:
  lottery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: 抽選自動申込
        run: python miwa_auto_lottery.py
        env:
          MIWA_BASE_URL: ${{ secrets.MIWA_BASE_URL }}
          MIWA_FACILITY_ID_RESERVE: ${{ secrets.MIWA_FACILITY_ID_RESERVE }}
          MIWA_USER_ID: ${{ secrets.MIWA_USER_ID }}
          MIWA_PASSWORD: ${{ secrets.MIWA_PASSWORD }}
          MIWA_DRY_RUN: ${{ github.event_name == 'schedule' && '0' || inputs.dry_run }}
          MIWA_TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miwa-screenshots
          path: artifacts/
          if-no-files-found: ignore
